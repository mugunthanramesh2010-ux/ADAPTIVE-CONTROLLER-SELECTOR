name: ACEP 4.0 Production CI/CD & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax & Integrity Validation
        run: |
          node -c server.js
          node -c web_app/app.js
          node -c web_app/simulation_engine.js
          node -c web_app/universal_studio.js
          node -c web_app/acep_paper_content.js
          echo "All client-side and server modules validated successfully."

  deploy-pages:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web_app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
